[project]
name = "cozmo-ingestion"
version = "0.2.0"
description = "Holo: validated capture ingestion and assisted RGB room reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
preprocess = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]
reconstruct = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pycolmap==4.2.1",
]
dense = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "pycolmap-cuda12==4.2.1; sys_platform == 'linux'",
    "pycolmap==4.2.1; sys_platform != 'linux'",
]

[project.scripts]
holo-run = "cozmo_web.capture_cli:main"
cozmo-ingest = "cozmo_ingestion.cli:ingest_main"
cozmo-verify = "cozmo_ingestion.cli:verify_main"
cozmo-web = "cozmo_web.cli:main"
cozmo-preprocess = "cozmo_preprocessing.cli:main"
cozmo-reconstruct = "cozmo_reconstruction.cli:main"
cozmo-dense = "cozmo_reconstruction.dense.cli:main"
cozmo-surfaces = "cozmo_reconstruction.surfaces.cli:main"
cozmo-grounding = "cozmo_reconstruction.grounding.cli:main"
cozmo-boundaries = "cozmo_reconstruction.boundaries.cli:main"
cozmo-publish-reconstruction = "cozmo_reconstruction.viewer.cli:main"
cozmo-gaussians = "cozmo_reconstruction.gaussians.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo_ingestion", "src/cozmo_web", "src/cozmo_preprocessing", "src/cozmo_reconstruction"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/README.md", "/capture.md", "/capture_annotations",
    "/ingest.py", "/verify_capture.py", "/capture_reader.py",
    "/frontend", "/Dockerfile", "/compose.yaml", "/compose.gpu.yaml", "/.dockerignore", "/.env.example",
    "/compose.reconstruction.yaml", "/experiments/gsplat", "/evaluation_annotations",
    "/scripts", "/NATIVE_DENSE.md", "/INPUT_MODALITIES_PLAN.md", "/AUTOMATIC_RECONSTRUCTION.md",
    "/CONTEXT.md", "/NATIVE_DENSE_REGRESSION.md", "/NATIVE_FLOOR_PLAN_FIX.md", "/docs", "/submission",
]
exclude = ["**/node_modules", "**/dist", "**/.vite", "**/.venv", "**/.uv-cache", "**/__pycache__", "**/*.pyc", "**/.env"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.uv]
conflicts = [[{ extra = "reconstruct" }, { extra = "dense" }]]
required-version = ">=0.12.1"
cache-dir = ".uv-cache"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["outputs", ".uv-cache", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
