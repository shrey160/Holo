[project]
name = "cozmo-ingestion"
version = "0.2.0"
description = "Validated iOS capture ingestion for the Cozmo floor-plan prototype"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1"]

[project.scripts]
cozmo-ingest = "cozmo_ingestion.cli:ingest_main"
cozmo-verify = "cozmo_ingestion.cli:verify_main"
cozmo-web = "cozmo_web.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo_ingestion", "src/cozmo_web"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/README.md", "/ARCHITECTURE.md", "/capture.md", "/capture_annotations",
    "/ingest.py", "/verify_capture.py", "/capture_reader.py",
    "/INGESTION_RESULTS.md", "/REFACTOR_RESULTS.md", "/INGESTION_PLAN.md", "/Overview.md",
    "/frontend", "/Dockerfile", "/compose.yaml", "/.dockerignore", "/.env.example",
    "/DOCKER_WEB_PLAN.md", "/WEB_RESULTS.md", "/WEB_SETUP.md",
]
exclude = ["**/node_modules", "**/dist", "**/.vite"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.uv]
required-version = ">=0.12.1"
cache-dir = ".uv-cache"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["outputs", ".uv-cache", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
